<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab-6A</title>
</head>
<body>
    <form method="post">
        <h2>Student Registration Form</h2>
        <table cellspacing="20">
            <tr>
                <td><label for="fullname">Full Name</label></td>
                <td><input type="text" placeholder="Enter Full Name" id="fullname" required></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td><input type="text" placeholder="Enter Email id" id="email" required></td>
            </tr>
            <tr>
                <td><label for="mobilenumber">Mobile No.</label></td>
                <td><input type="tel" placeholder="Enter Mobile No." id="mobilenumber" required></td>
            </tr>
            <tr>
                <td><label for="address">Address</label></td>
                <td><textarea placeholder="Enter your address" rows="5" cols="50" required></textarea></td>
            </tr>
            <tr>
                <td><label for="nationality">Nationality</label></td>
                <td><input type="text" placeholder="Enter nationality" id="nationality" required></td>
            </tr>
            <tr>
                <td><label for="dob">Date Of Birth</label></td>
                <td><input type="date" id="dob" required></td>
            </tr>
            <tr>
                <td><label for="ge">Gender</label></td>
                <td> <input type="radio" name="gender" id="fe"><label for="fe">Female</label>
                <input type="radio" name="gender" id="me"><label for="me">Male</label></td>
            </tr>
            <tr>
                <td><label for="hd">Highest Degree</label></td>
                <td>
                    <select>
                        <option>Select degree</option>
                        <option>B.tech</option>
                        <option>B.com</option>
                        <option>BCA</option>
                        <option>BBA</option>
                        <option>B.sc</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="cpi">CPI</label></td>
                <td><input type="tel" placeholder="Enter CPI" id="cpi" required></td>
            </tr>
            <tr>
                <td><label for="un">University</label></td>
                <td><input type="text" placeholder="Enter University Name" id="un" required></td>
            </tr>

            <tr>
                <td><label for="py">Passing Year</label></td>
                <td>
                    <select>
                        <option>Select Year</option>
                        <option>2027</option>
                        <option>2026</option>
                        <option>2025</option>
                        <option>2024</option>
                        <option>2023</option>
                        <option>2022</option>
                        <option>2021</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td></td>
                <td><input type="submit" value="Submit">  <input type="reset" value="Reset"></td>
            </tr>
        </table>
    </form>
    <br>
    <br>

            <tr>

            <tr>

</body>
</html>
