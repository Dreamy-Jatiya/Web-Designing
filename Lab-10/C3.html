<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Layout</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        width: 800px;
        border: 3px solid #000;
        background: white;
      }

      /* Header */
      header {
        background: #c62828;
        color: white;
        text-align: center;
        padding: 25px;
        font-size: 28px;
        font-weight: bold;
      }

      /* Main Section */
      .main {
        display: flex;
        height: 400px;
        gap: 10px;
        padding: 10px;
      }

      /* Navigation */
      nav {
        width: 150px;
        background: #283593;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        font-weight: bold;
      }

      /* Content */
      .content {
        flex: 1;
        background: #ffeb3b;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        font-weight: bold;
      }

      /* Sidebar */
      aside {
        width: 140px;
        background: #0b8043;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        font-weight: bold;
      }

      /* Footer */
      footer {
        background: #29b6f6;
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 28px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>Header</header>

      <div class="main">
        <nav>Navigation</nav>

        <section class="content">Content</section>

        <aside>Sidebar</aside>
      </div>

      <footer>Footer</footer>
    </div>
  </body>
</html>
