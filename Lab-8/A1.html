<!--1. Create an HTML5 page using semantic tags like <header>, <nav>, <main>, <article>, <section>, 
and <footer> to structure the layout of a simple website. (A) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>program-1</title>
</head>
<body>
    <header>
        <h1>My Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
    </nav>

    <main><article>
        <h1>C-Programming Tutorial</h1>
        <section>
            <h2>Introduction</h2>
            <p>C is a programming language</p>
        </section>
    </article></main>

    <footer>
        <p>&copy;2025 My Website</p>
    </footer>
</body>
</html>
