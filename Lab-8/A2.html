<!--2. Develop a contact form using HTML5 form elements such as <input type="email">, <input 
type="tel">, <input type="date">, and <textarea>. (A) -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program-2,3</title>
</head>
<body>
    <form method="post">
        <table align="center">
            <caption>Registration Form</caption>
            <tr>
                <td><label for="fname">Full Name</label></td>
                <td><input type="text" id="fname" placeholder="enter a name" required></td>
            </tr>

            <tr>
                <td><label for="email">email</label></td>
                <td><input type="text" id="email" placeholder="enter a email" required></td> 
            </tr>

            <tr>
                <td><label for="phone">Phone No.</label></td>
                <td><input type="number" id="phone" placeholder="enter phone no." required></td>
            </tr>

            <tr>
                <td><label>Date</label></td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td><label for="add">Address</label></td>
                <td><input type="text" id="add" placeholder="enter address" required></td>
            </tr>

            <tr>
                <td><input type="submit" value="SUBMIT"></td>
            </tr>
        </table>
    </form>
</body>
</html>
