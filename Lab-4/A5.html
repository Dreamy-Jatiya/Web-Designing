<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab-4 fifth</title>
</head>
<body>
    <h2>Lists</h2>
    <h3>Unordered Lists</h3>
    <ul type="circle">
        <li>Mango</li>
        <li>Apple</li>
        <li>Grapes</li>
        <li>Pineapple</li>
        <li>Custardapple</li>
    </ul>

    <h3>Ordered Lists</h3>
    <ol type="1" start="5">
        <li>Pencil</li>
        <li>Eraser</li>
        <li>Sharpner</li>
        <li>Scale</li>
    </ol>

    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
    </dl>
</body>
</html>
