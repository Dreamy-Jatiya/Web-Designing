<!--  1. Using the :hover pseudo-class to change the appearance of links when hovered over,but limited to links within a specific container. 
      2. Applying styles to input fields when they receive focus using the :focus pseudo-class. 
      3. Utilize the :hover pseudo-class to highlight table rows when hovered over. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        li:nth-child(even){
            background-color: plum;
        }
        li:nth-child(odd){
            background-color: rgb(231,106,231);
        }
        ul:hover{
            list-style-type:lower-roman ;
        }
        ol:hover{
            list-style-type: upper-latin;
        }
        form{
            background: linear-gradient(45deg,rgb(238, 137, 153),lightpink);
        }
        input:hover{
            background-color: rgb(160,236,232);
        }
        table{
            text-align: center;
        }
        td:hover{
            background: linear-gradient(pink,yellow);
        }
    </style>
</head>
<body>

</html>
