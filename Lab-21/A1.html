<!--  Design SIGN-IN form using Bootstrap. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="text-center" >
      <p class="display-5 text-center"><b>Student Registration</b></p>

      <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="fullname" class="col-form-label">FullName</label>
        </div>
        <div class="col-3">
          <input type="text" id="fullname" class="form-control" />
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="email" class="col-form-label">E-mail</label>
        </div>
        <div class="col-3">
          <input type="email" id="email" class="form-control" placeholder="email@gmail.com" />
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="number" class="col-form-label" >Mobile No.</label>
        </div>
        <div class="col-3">
          <input type="number" id="number" class="form-control"/>
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="address" class="col-form-label" >Address</label>
        </div>
        <div class="col-3">
          <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="nationality" class="col-form-label" >Nationality</label>
        </div>
        <div class="col-3">
          <input type="text" id="nationality" class="form-control"/>
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="date" class="col-form-label" >Date of Birth</label>
        </div>
        <div class="col-3">
          <input type="date" id="date" class="form-control"/>
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
       <div class="col-auto">
          <label for="gender" class="col-form-label" >Gender</label>
          <input class="form-check-input ms-4" type="radio" name="gender" id="female">Female
          <input class="form-check-input ms-4" type="radio" name="gender" id="female">Male
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="degree" class="col-form-label" >Highest Degree</label>
        </div>
        <div class="col-3">
          <select class="form-select col-auto" aria-label="Default Select Example">
            <option selected>Degree</option>
            <option value="1">B.Tech</option>
            <option value="2">M.Tech</option>
            <option value="3">BCA</option>
            <option value="4">MCA</option>
          </select>
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="cpi" class="col-form-label" >CPI</label>
        </div>
        <div class="col-3">
          <input type="number" id="cpi" class="form-control"/>
        </div>
      </div>
      <br>

    <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="uni" class="col-form-label">University</label>
        </div>
        <div class="col-3">
          <input type="text" id="uni" class="form-control" />
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
        <div class="col-auto">
          <label for="year" class="col-form-label" >Passing Year</label>
        </div>
        <div class="col-3">
          <select class="form-select col-auto" aria-label="Default Select Example">
            <option selected>Passing Year</option>
            <option value="1">2026</option>
            <option value="2">2025</option>
            <option value="3">2024</option>
            <option value="4">2023</option>
            <option value="5">2022</option>
            <option value="6">2021</option>
            <option value="7">2020</option>
            <option value="8">2019</option>
          </select>
        </div>
      </div>
      <br>

      <div class="row g-3 justify-content-center">
       <div class="col-12 text-center">
        <input type="submit" value="Submit" class="mx-1"><input type="reset" value="Cancel" class="mx-12">
       </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
