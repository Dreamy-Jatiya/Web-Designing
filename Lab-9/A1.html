<!--1. Create an HTML page that applies different styles using basic CSS selectors: element selector 
(p), class selector (.className), and ID selector (#idName). (A) -->

<!doctype html>
<html>
  <head>
    <title>Basic CSS Selectors</title>

    <style>
      /* Element Selector */
      p {
        color: blue;
        font-size: 18px;
      }

      /* Class Selector */
      .highlight {
        background-color: yellow;
        color: red;
        font-weight: bold;
      }

      /* ID Selector */
      #heading {
        color: green;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <h1 id="heading">Basic CSS Selectors</h1>
    <p>This paragraph is styled using the element selector.</p>
    <p class="highlight">This paragraph uses the class selector.</p>
    <p>This is another normal paragraph.</p>
  </body>
</html>
